name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Scan the demo (precise readers where available)
        run: node tests/smoke.mjs
      - name: Scan the demo (plain-text reader only)
        run: node tests/smoke.mjs --generic
